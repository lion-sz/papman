[project]
name = "papman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lion Szlagowski", email = "lion-sz@gmx.de" }
]
requires-python = ">=3.13"
dependencies = [
    "bibtexparser>=2.0.0b9",
    "requests>=2.32.5",
    "textual>=7.5.0",
]

[project.scripts]
papman = "papman:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "textual-dev>=1.8.0",
]
